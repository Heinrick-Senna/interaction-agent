services:
  agent:
    build: .
    container_name: interaction-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Override so agent talks to evolution via internal network
      EVOLUTION_API_URL: http://evolution:8080
      DB_PATH: /app/data/finance.sqlite
    volumes:
      # SQLite persists on your machine at ./data/finance.sqlite
      - ./data:/app/data
      # Auto-deploy: Docker socket (for rebuild) + project dir (for git pull)
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    depends_on:
      evolution:
        condition: service_healthy
    networks:
      - finance-net

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      LANGUAGE: en
      WEBHOOK_GLOBAL_URL: http://agent:3000/api/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "Chrome"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
    volumes:
      - ./evolution-data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

networks:
  finance-net:
    driver: bridge

volumes:
  postgres-data:
